name: kobkob-kaidf-generator CI

on:
  push:
    branches:
      - main
    paths:
      - "kobkob-kaidf-generator/**"
      - ".github/workflows/kobkob-kaidf-generator-ci.yml"
  pull_request:
    paths:
      - "kobkob-kaidf-generator/**"
      - ".github/workflows/kobkob-kaidf-generator-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kobkob-kaidf-generator
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Known backlog: existing Markdown does not pass markdownlint yet. Reported but not blocking.
      - name: Lint Markdown
        continue-on-error: true
        run: npx --yes markdownlint-cli2 "**/*.md" "!**/node_modules/**"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and dev tools
        run: pip install -e ".[dev]"

      - name: Lint Python
        run: python -m ruff check .

      # Known backlog: three files are not ruff-formatted yet. Reported but not blocking.
      - name: Check Python formatting
        continue-on-error: true
        run: python -m ruff format --check .

      - name: Run tests
        run: python -m pytest -q

      - name: Validate default spec
        run: python -m kaidf_gen.cli validate specs/kaidf.default.yaml
