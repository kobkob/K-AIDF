name: kobkob-kaidf-generator CI

on:
  # Called by .github/workflows/release.yml on tag pushes; the push and
  # pull_request triggers below are unchanged.
  workflow_call:
  push:
    branches:
      - main
    paths:
      - "kobkob-kaidf-generator/**"
      - ".github/workflows/kobkob-kaidf-generator-ci.yml"
  pull_request:
    paths:
      - "kobkob-kaidf-generator/**"
      - ".github/workflows/kobkob-kaidf-generator-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kobkob-kaidf-generator
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.24.1 "**/*.md" "!**/node_modules/**"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install package and dev tools
        run: pip install -c constraints-ci.txt -e ".[dev]"

      - name: Lint Python
        run: python -m ruff check .

      - name: Check Python formatting
        run: python -m ruff format --check .

      - name: Run tests
        run: python -m pytest -q

      - name: Validate default spec
        run: python -m kaidf_gen.cli validate specs/kaidf.default.yaml
