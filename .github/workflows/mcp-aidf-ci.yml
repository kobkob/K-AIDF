name: mcp-aidf CI

on:
  push:
    branches:
      - main
    paths:
      - "mcp-aidf/**"
      - ".github/workflows/mcp-aidf-ci.yml"
  pull_request:
    paths:
      - "mcp-aidf/**"
      - ".github/workflows/mcp-aidf-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-aidf
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Known backlog: existing Markdown and Python do not pass the lint/format checks yet.
      # Those steps are reported but not blocking until the backlog is cleared.
      - name: Lint Markdown
        continue-on-error: true
        run: npx --yes markdownlint-cli2 "**/*.md" "!**/node_modules/**"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Lint Python
        continue-on-error: true
        run: python -m ruff check .

      - name: Check Python formatting
        continue-on-error: true
        run: python -m ruff format --check .

      - name: Syntax check
        run: python -m py_compile app.py

      - name: Import app module
        run: python -c "import app"

      - name: Run tests
        run: python -m pytest -q
