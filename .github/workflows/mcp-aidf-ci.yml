name: mcp-aidf CI

on:
  # Called by .github/workflows/release.yml on tag pushes; the push and
  # pull_request triggers below are unchanged.
  workflow_call:
  push:
    branches:
      - main
    paths:
      - "mcp-aidf/**"
      - "agent-aidf/**"
      - "contracts/**"
      # tests/test_easypanel_template.py checks deploy/easypanel/ against the Dockerfile and
      # app.py, and tests/test_workspace_docs.py indexes the workspace docs/ tree, so both
      # directories are inputs of this suite.
      - "deploy/**"
      - "docs/**"
      - ".github/workflows/mcp-aidf-ci.yml"
  pull_request:
    paths:
      - "mcp-aidf/**"
      - "agent-aidf/**"
      - "contracts/**"
      - "deploy/**"
      - "docs/**"
      - ".github/workflows/mcp-aidf-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-aidf
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2 "**/*.md" "!**/node_modules/**"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest ruff "mcp>=2,<3"
          # The maturity tools import the audit engine from agent-aidf (the image bundles it too).
          pip install ../agent-aidf

      - name: Lint Python
        run: python -m ruff check .

      - name: Check Python formatting
        run: python -m ruff format --check .

      - name: Syntax check
        run: python -m py_compile app.py

      - name: Import app module
        run: python -c "import app"

      - name: Run tests
        # The engine is installed above, so its tests must run rather than skip.
        env:
          KAIDF_REQUIRE_ENGINE: "1"
        run: python -m pytest -q

  image:
    # Builds the Docker image from the repository root and checks the maturity tools answer 200.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and check the image
        run: bash mcp-aidf/scripts/check-image.sh
