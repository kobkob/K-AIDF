name: "K-AIDF CLA Assistant"

# pull_request_target runs the workflow of the base branch with its secrets, never the pull
# request's code, so forks are covered. issue_comment lets a contributor sign by commenting
# "I have read the CLA Document and I hereby sign the CLA" (or "recheck") on the pull request.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# The signatures live in this repository (signatures/cla.json on main), so the default
# GITHUB_TOKEN with these permissions is enough; no personal access token is needed.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAsistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant Check"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/kobkob/K-AIDF/blob/main/CONTRIBUTOR_LICENSE_AGREEMENT.md'
          branch: 'main'
          allowlist: 'bot-kobkob,monsenhor,eltonaquino'
