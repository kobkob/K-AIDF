name: agent-aidf CI

on:
  # Called by .github/workflows/release.yml on tag pushes; the push and
  # pull_request triggers below are unchanged.
  workflow_call:
  push:
    branches:
      - main
    paths:
      - "agent-aidf/**"
      - "contracts/**"
      # tests/test_audit_layouts.py generates the default scaffold from the sibling
      # generator checkout, so its spec and templates are inputs of this suite.
      - "kobkob-kaidf-generator/specs/**"
      - "kobkob-kaidf-generator/src/kaidf_gen/**"
      - ".github/workflows/agent-aidf-ci.yml"
  pull_request:
    paths:
      - "agent-aidf/**"
      - "contracts/**"
      - "kobkob-kaidf-generator/specs/**"
      - "kobkob-kaidf-generator/src/kaidf_gen/**"
      - ".github/workflows/agent-aidf-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-aidf
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-ci.txt .[dev] ruff

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.24.1 "**/*.md" "!**/node_modules/**"

      - name: Lint Python
        run: python -m ruff check .

      - name: Check Python formatting
        run: python -m ruff format --check .

      - name: Run tests
        run: PYTHONPATH=src python -m pytest -q
