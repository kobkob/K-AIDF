services:
  aidf-ollama:
    image: ollama/ollama:latest
    container_name: aidf-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  mcp-server:
    build:
      context: ./mcp-aidf
    container_name: mcp-aidf-server
    ports:
      - "8080:8080"
    environment:
      - KAIDF_LOCAL_INFERENCE=true
      - OLLAMA_HOST=http://aidf-ollama:11434
    depends_on:
      aidf-ollama:
        condition: service_healthy

volumes:
  ollama_data:
