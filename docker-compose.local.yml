services:
  aidf-ollama:
    # Pinned by digest so every pull gets the same image. Resolved from ollama/ollama:latest on
    # 2026-11-13; to upgrade, resolve the new digest and update this line in the same change.
    image: ollama/ollama:latest@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    container_name: aidf-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # Loopback only: Ollama has no authentication, and Docker's port publishing bypasses ufw.
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  mcp-server:
    # Optional, in the "mcp" profile: `make workspace-mcp-up` starts it and `make workspace-up`
    # does not. It needs SECRET_KEY and MCP_BEARER_TOKEN from .env, so the Ollama stack must not
    # depend on them.
    profiles: ["mcp"]
    build:
      context: .
      dockerfile: mcp-aidf/Dockerfile
    container_name: mcp-aidf-server
    ports:
      # Host 8080 -> container 7777, the port the image listens on (EXPOSE 7777).
      - "8080:7777"
    environment:
      - KAIDF_LOCAL_INFERENCE=true
      - OLLAMA_HOST=http://aidf-ollama:11434
      - AIDF_REPO_ROOT=/data/kaidf-repo
      # Empty defaults on purpose: compose also checks inactive profiles, and `make workspace-up`
      # must not fail on these. `make workspace-mcp-up` refuses to start without them.
      - SECRET_KEY=${SECRET_KEY:-}
      - MCP_BEARER_TOKEN=${MCP_BEARER_TOKEN:-}
      - MCP_TOKEN_SCOPES=${MCP_TOKEN_SCOPES:-}
    volumes:
      # The K-AIDF repository the tools read. `make workspace-mcp-up` points it at the generated repo.
      - ${AIDF_REPO_HOST_PATH:-.}:/data/kaidf-repo:ro
    depends_on:
      aidf-ollama:
        condition: service_healthy

volumes:
  ollama_data:
