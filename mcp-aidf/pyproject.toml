[project]
name = "mcp-aidf"
version = "0.6.0rc1"
description = "MCP server exposing K-AIDF documents and maturity tools."
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

